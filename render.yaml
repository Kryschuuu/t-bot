# Render Blueprint: Django/Channels Paper-Trading-Bot + PostgreSQL.
# Auf dem Free-Plan schläft der Web-Service bei Inaktivität ein; dadurch kann
# der In-Process-Bot dort nicht garantiert rund um die Uhr laufen.
services:
  - type: web
    name: t-bot-web
    runtime: docker
    plan: free
    region: frankfurt
    branch: arena/01a01bc6-t-bot
    dockerfilePath: ./Dockerfile
    dockerCommand: >-
      /bin/sh -c 'python manage.py migrate --noinput && exec daphne -b 0.0.0.0 -p $PORT trading_bot_project.asgi:application'
    healthCheckPath: /health/
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PASSPHRASE
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "True"
      - key: AUTOSTART_BOTS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: t-bot-db
          property: connectionString

databases:
  - name: t-bot-db
    plan: free
    region: frankfurt
    databaseName: tbot_db
    user: tbot
    postgresMajorVersion: "18"
