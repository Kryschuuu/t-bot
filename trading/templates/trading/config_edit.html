{% extends "trading/base.html" %}
{% block content %}
<h2>Konfiguration bearbeiten (ID: {{ config.id }})</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}    
    <button type="submit" class="btn btn-primary">Aktualisieren</button>
</form>
<a href="{% url 'config_list' %}" class="btn btn-secondary mt-3">Zurück zur Konfigurationsliste</a>
{% endblock %}
